name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The toolchain the code is developed and linted with; newer clippy versions
  # add lints, so the bump is a deliberate change.
  RUST_TOOLCHAIN: 1.97.0
  # Crates that are finished; the others join as they are completed.
  CRATES: -p hds-ntfs -p hds-io -p hds-carve -p hds-core -p hds-recover -p hds-engine

jobs:
  linux:
    name: Linux (engine tests on real NTFS fixtures, app analysis)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # apt on hosted runners took 10 to 19 minutes. The downloaded packages are
      # cached; on a hit they are installed from the files, without apt-get update.
      - uses: actions/cache@v4
        id: debs
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-24.04-ntfs3g-fuse3-fdisk-pil-ffmpeg-v1

      - name: Install fixture tools
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # man-db triggers take minutes on hosted runners and are not needed.
          sudo rm -f /var/lib/man-db/auto-update
          pkgs="ntfs-3g fuse3 fdisk python3-pil ffmpeg"
          if [ "${{ steps.debs.outputs.cache-hit }}" = true ] && ls ~/apt-debs/*.deb >/dev/null 2>&1; then
            time sudo apt-get install -y -q --no-install-recommends ~/apt-debs/*.deb
          else
            time sudo apt-get update -q
            time sudo apt-get install -y -q --no-install-recommends --download-only $pkgs
            mkdir -p ~/apt-debs
            cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
            time sudo apt-get install -y -q --no-install-recommends $pkgs
          fi
          for t in mkntfs ntfs-3g sfdisk ffmpeg ffprobe; do command -v $t >/dev/null || { echo "missing $t"; exit 1; }; done

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build the NTFS fixtures (mkntfs + ntfs-3g)
        run: |
          sudo scripts/linux/make-fixtures.sh "$GITHUB_WORKSPACE/fixtures-out"
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/fixtures-out"
          ls -la "$GITHUB_WORKSPACE/fixtures-out"

      - name: Format
        working-directory: engine
        run: cargo fmt $CRATES -- --check

      - name: Clippy
        working-directory: engine
        run: cargo clippy $CRATES --all-targets -- -D warnings

      - name: Tests (with fixtures)
        working-directory: engine
        env:
          HDS_FIXTURES: ${{ github.workspace }}/fixtures-out
        run: cargo test $CRATES

      - name: Test-image builder (cross-checked with the independent decoder)
        working-directory: engine
        run: |
          cargo fmt -p hds-testkit -- --check
          cargo clippy -p hds-testkit --all-targets -- -D warnings
          cargo test -p hds-testkit

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Flutter analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  windows:
    name: Windows (engine tests, raw disk and destination guard on real virtual disks)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Clippy (Windows code paths)
        working-directory: engine
        shell: bash
        run: cargo clippy $CRATES --all-targets -- -D warnings

      - name: Tests
        working-directory: engine
        shell: bash
        run: cargo test $CRATES

      - name: Build winprobe
        working-directory: engine
        shell: bash
        run: cargo build --release -p hds-io --example winprobe

      - name: Raw disk, destination guard and output primitives on virtual disks
        shell: pwsh
        run: scripts/windows/ci-io-probe.ps1 -Probe engine/target/release/examples/winprobe.exe

  windows-app:
    name: Windows app build (Flutter, requireAdministrator manifest, engine bundling)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build the engine
        working-directory: engine
        shell: bash
        run: cargo build --release -p hds-engine

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Build the app
        working-directory: app
        shell: pwsh
        env:
          HDSAVIOR_ENGINE_EXE: ${{ github.workspace }}\engine\target\release\hdsavior-engine.exe
        run: |
          flutter pub get
          flutter build windows --release
          $bundle = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$bundle\hdsavior.exe")) { throw 'hdsavior.exe missing' }
          if (-not (Test-Path "$bundle\hdsavior-engine.exe")) { throw 'the engine was not bundled' }
          # The manifest must ask for administrator rights.
          $exe = [IO.File]::ReadAllBytes((Resolve-Path "$bundle\hdsavior.exe"))
          $text = [Text.Encoding]::ASCII.GetString($exe)
          if ($text -notmatch 'requireAdministrator') { throw 'requireAdministrator not in the embedded manifest' }
          Get-ChildItem $bundle

      - uses: actions/upload-artifact@v4
        with:
          name: hdsavior-windows-preview
          path: app/build/windows/x64/runner/Release
          retention-days: 7

  windows-facts:
    name: Windows quick-format facts (informational)
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Measure what a quick format leaves behind
        shell: pwsh
        run: scripts/windows/format-facts.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: format-facts
          path: ${{ runner.temp }}/format-facts
          retention-days: 30
