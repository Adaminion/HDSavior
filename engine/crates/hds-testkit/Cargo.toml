[package]
name = "hds-testkit"
description = "Synthetic NTFS image builder for tests (independent of hds-ntfs)."
version.workspace = true
edition.workspace = true
publish.workspace = true

# Deliberately no dependency on any other hds crate: a parser and a builder
# that share code would share misunderstandings (ARCHITECTURE.md section 7).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
