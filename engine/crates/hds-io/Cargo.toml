[package]
name = "hds-io"
description = "Read-only block sources, disk enumeration, partition tables, the destination guard and the output primitives."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Data types that cross the engine protocol or go into session files.
serde = { version = "1", features = ["derive"] }

# Output primitives that never follow links (openat, mkdirat, renameat2, ...) and statvfs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Version and features as verified in docs/notes/windows-raw-io.md, section 1.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_Storage_Vhd",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
]

[dev-dependencies]
# Tests check the wire form of the serde types against PROTOCOL.md and read the fixture
# manifests; the winprobe example prints its results as JSON.
serde_json = "1"
